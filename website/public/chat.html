<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bucket List Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="headlineWrap">
      <h1 class="headline">🪣 Bucket List</h1>
      <div class="headerActions">
        <a href="/" class="pillToggle">📋 List</a>
        <span class="pillToggle on">💬 Chat</span>
      </div>
    </div>
    <div id="messages" class="chatMessages"></div>
    <div class="chatInputWrap">
      <input id="input" class="searchBox" type="text" placeholder="Ask me anything about the bucket list…" />
    </div>
  </div>
  <script src="chat.js"></script>
</body>
</html>
